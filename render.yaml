services:
  - type: web
    name: api-banque
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_NAME
        value: "API Banque"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://moustapha-seck.onrender.com
      - key: APP_KEY
        fromSecret: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d40eu76r433s738b86ig-a
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: banque_api_iiop
      - key: DB_USERNAME
        value: banque_user
      - key: DB_PASSWORD
        value: B8nSoFPHv3raL3pZWafjdpb9h3uf0rvv
      - key: CACHE_DRIVER
        value: redis
      - key: REDIS_HOST
        fromService:
          type: redis
          name: api-banque-redis
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: api-banque-redis
      - key: REDIS_PORT
        value: 6379
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        fromSecret: MAIL_HOST
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        fromSecret: MAIL_USERNAME
      - key: MAIL_PASSWORD
        value: fwmd dvos uelp fxuj
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        fromSecret: MAIL_FROM_ADDRESS
      - key: MAIL_FROM_NAME
        value: "API Banque"
      - key: L5_SWAGGER_GENERATE_ALWAYS
        value: true
      - key: L5_SWAGGER_CONST_HOST
        value: https://moustapha-seck.onrender.com
    buildCommand: |
      composer install --optimize-autoloader --no-dev --no-interaction
      php artisan key:generate --force
      php artisan vendor:publish --provider "L5Swagger\L5SwaggerServiceProvider" --force
      # Passport est maintenant géré via les variables d'environnement dans AppServiceProvider
      # Désactiver temporairement les caches pour éviter les problèmes avec les routes Closure
      # php artisan config:cache
      # php artisan route:cache
      # php artisan view:cache
    startCommand: |
      /usr/local/bin/start.sh

databases:
  - name: api-banque-db
    databaseName: banque_api
    user: banque_user
    plan: starter

redis:
  - name: api-banque-redis
    plan: starter

  - type: web
    name: api-banque-adminer
    runtime: docker
    dockerfilePath: ./Dockerfile.adminer
    dockerContext: .
    plan: starter
    envVars:
      - key: ADMINER_DEFAULT_SERVER
        value: dpg-d40eu76r433s738b86ig-a
      - key: ADMINER_DEFAULT_DB
        value: banque_api_iiop


